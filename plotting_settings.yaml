robot: "trunk" #trunk, hardware
save_dir: "plots/"
file_format: "eps"

#traj_dir: "sim_trajs/circle_z=-10" # figure8" #
traj_dir: ""

show: {
    'ssmr': False, # Full obsevables
    'ssmr_origin': False, # pos-vel
    'ssmr_1delay': True, # Single delay embedding
    'ssmr_2delay': False, # Single delay embedding
    'linear': True, # Linear model
    # Adiabatic SSM settings
    'ssmr_adiabatic_idw': False,
    'ssmr_adiabatic_modified_idw': True,
    'ssmr_adiabatic_qp': True,
    'ssmr_adiabatic_nn': False,
    'ssmr_adiabatic_linear': False,
    'ssmr_adiabatic_ct': False,
    'tpwl': True,
    'koopman': True,
    'rompc': False
}
display_name: {
    'ssmr': "SSMR (Full Delay Observables)",
    'ssmr_origin': "SSMR (Position-Velocity)", # "SSMR (origin)",
    'ssmr_1delay': "SSMR (Single Time Delay)", # Single delay embedding
    'ssmr_2delay': "SSMR (Double Time Delay)", # Double delay embedding
    'linear': "Linear Model (Single Time Delay)", # Linear SSMR Model
    'ssmr_adiabatic_linear': "LB",
    'ssmr_adiabatic_ct': "CT",
    'ssmr_adiabatic_nn': "NN",
    'ssmr_adiabatic_qp': "QPR",
    'ssmr_adiabatic_idw': "IDW",
    'ssmr_adiabatic_modified_idw': "MIDW",
    'tpwl': "TPWL",
    'koopman': "Koopman",
    'rompc': "ROMPC",
}
color: {
    'ssmr': 'tab:blue',
    'ssmr_origin': 'tab:red',
    'ssmr_1delay': 'tab:orange',
    'ssmr_2delay': 'tab:green',
    'linear': 'tab:purple',
    'ssmr_adiabatic_linear': "tab:green",
    'ssmr_adiabatic_ct': "tab:blue",
    'ssmr_adiabatic_nn': "tab:brown",
    'ssmr_adiabatic_qp': "tab:purple",
    'ssmr_adiabatic_idw': "tab:red",
    'ssmr_adiabatic_modified_idw': "tab:red",
    'tpwl': 'tab:red',
    'koopman': 'tab:green',
    'rompc': 'tab:purple',
    'target': 'black'
}
linestyle: {
    'ssmr': '-',
    'ssmr_origin': '-',
    'ssmr_1delay': '-',
    'ssmr_2delay': '-',
    'linear': '-',
    'tpwl': '-',
    'koopman': '-',
    'rompc': '-',
    'target': '--'
}
linewidth: {
    'ssmr': 2,
    'ssmr_origin': 2,
    'ssmr_1delay': 3,
    'ssmr_2delay': 2,
    'linear': 2,
    'ssmr_adiabatic_qp': 2,
    'ssmr_adiabatic_modified_idw': 2,
    'tpwl': 2,
    'koopman': 2,
    'rompc': 2,
    'target': 1
}

# select_target: "circle"
select_target: "pacman"
# Figure8 target
define_targets: {
    figure8: {
        M: 1,
        T: 10,
        N: 1000,
        radius: 30, # 20, # 30, # 
        z_const: 0, # -10, # 0, # 
        # state constraints
        z_lb: null, # [-16, -16],
        z_ub: null  # [16, 5]
    },
    circle: {
        M: 1,
        T: 10,
        N: 1000,
        radius: 20,
        z_const: -10,
        # state constraints
        z_lb: null, # [-16, -16],
        z_ub: null  # [16, 5]
    },
    pacman: {
        z_const: 0, # -10, # 0, # 
        z_lb: null,
        z_ub: null
    },
    custom: {
        z_const: 0, # -10, # 0, # 
        z_lb: null,
        z_ub: null
    }
}

plot_mpc_rollouts: False


